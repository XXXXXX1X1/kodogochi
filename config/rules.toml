[rules]
health_loss_per_day = 20      # минус здоровье за каждые полные сутки красной сборки
mood_step = 10                # штраф и бонус настроения
mood_recovery_per_day = 10    # восстановление настроения, если просроченных PR нет
review_wait_hours = 48        # PR без ревью дольше этого — питомец грустит
sleep_after_days = 7          # без правок столько суток — засыпает
daily_notifications = 5       # инициативных сообщений в сутки на чат (не больше 5: ограничение в базе)
quiet_start = "23:00"         # тишина по часовому поясу чата
quiet_end = "09:00"
friday_after = "18:00"        # правка в основную ветку строго после этого времени в пятницу — паника
