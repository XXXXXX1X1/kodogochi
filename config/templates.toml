# Резервные реплики: подставляются, если нейросеть недоступна, медлит или ответила неподходящим текстом.
# Поля: {name} — имя питомца, {red_days} — суток красной сборки, {pr_wait_hours} — часов ожидания ревью.
[templates]
ci_failed = [
  "Ой, {name} заболел 🤒 Сборка упала. Кто поможет её починить?",
  "Апчхи! Сборка стала красной, и {name} слёг. Помогите мне, пожалуйста!",
]
ci_fixed = [
  "Сборка снова зелёная. Спасибо за помощь! {name} снова бодр 💪",
  "Ура, я выздоровел! Сборка прошла — спасибо, что починили.",
]
revived = [
  "{name} воскрес! Сборку починили, и я снова с вами ✨",
]
died = [
  "Здесь покоится {name}. Его погубили {red_days} суток красной сборки. Почините CI, чтобы его вернуть.",
